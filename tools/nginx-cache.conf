# tools/nginx-cache.conf — cache and MIME policy for typer198x.com (PLAN A10, findings G025/G026).
#
# Include this file inside the `server { ... }` block that serves the web build, e.g.
#     server {
#         listen 443 ssl http2;
#         server_name typer198x.com;
#         root /var/www/typer198x;
#         include /etc/nginx/snippets/typer198x-cache.conf;   # this file
#     }
# then `nginx -t && nginx -s reload` and verify with `tools/deploy-check.sh https://typer198x.com --strict`.
#
# Policy (two version tokens, see README "Versioning"):
#   * The HTML shell, the root URL and assets/opt/manifest.js are NEVER cached without revalidation.
#     They are the entry points that carry the ?v= tokens; if a browser keeps a stale copy for 180 days
#     (today's behaviour, G025) no release ever reaches returning players.
#   * Any URL carrying ?v=<token> (scripts, stylesheets, art, audio) is immutable for a year: the token
#     changes whenever the content changes (tools/bump-version.sh for the shell token, the manifest
#     version for assets/opt/*), so the browser never has to ask again.
#   * Media and fonts requested without a token (native fallbacks, direct links) get 30 days.
#   * Correct MIME types for the formats the browser build streams: WebP art, MP3 music, WAV one-shots,
#     the self-hosted WOFF2 font. Wrong types break <audio>/<img> decoding and font loading.
#
# nginx notes: regex locations are tried in file order and the first match wins, so the font block
# precedes the general media block. `add_header` inside an `if` replaces (does not extend) the
# location's own add_header set, which is what the versioned branches rely on. A `types` block in a
# server context replaces the inherited table, hence the `include mime.types;` right before it.

# ---- MIME types ------------------------------------------------------------------------------
include mime.types;
types {
    audio/wav                 wav;
    audio/mpeg                mp3;
    image/webp                webp;
    font/woff2                woff2;
    font/woff                 woff;
    image/svg+xml             svg svgz;
    application/manifest+json webmanifest;
}
charset utf-8;
charset_types text/css text/javascript application/javascript application/json image/svg+xml;

# ---- Entry points: always revalidate (exact matches win over every regex below) ------------
location = / {
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    try_files /index.html =404;
}
location = /index.html {
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
}
location = /assets/opt/manifest.js {
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    default_type text/javascript;
}

# Secondary pages (info, support, privacy) revalidate like the shell.
location ~* \.html$ {
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
}

# ---- Code: immutable only when the URL is versioned ------------------------------------------
# A bare request (someone bookmarked game.js without a token, G026) still revalidates.
location ~* \.(js|mjs|css)$ {
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    if ($args ~* "(^|&)v=") {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json;
    gzip_vary on;
}

# ---- Font: preloaded with crossorigin, so the CORS header must be present ---------------------
location ~* \.woff2?$ {
    add_header Access-Control-Allow-Origin "https://typer198x.com" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# ---- Art, audio, icons: long-lived, immutable when versioned, byte ranges on (music seeks) -----
location ~* \.(webp|png|jpe?g|gif|svg|ico|mp3|wav|m4a|ogg|ttf)$ {
    add_header Cache-Control "public, max-age=2592000" always;
    if ($args ~* "(^|&)v=") {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    access_log off;
}
